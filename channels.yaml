# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_10                        # unique; used in DB, logs, secret names
    tiktok_username: "bro.and.dickens"    # no @  -- chaotic / funny cat content (a guy + his cat "Dickens")
    youtube_channel_name: "Cat Chaos Lab"
    owner_email: "dkdhaker00011@gmail.com"

    google_credentials_file: "credentials/channel_10_client_secret.json"
    oauth_token_file: "tokens/channel_10_token.json"

    videos_per_day: 2
    description_footer: ""
    default_tags: [funny cats, cat shorts, cat chaos, funny animals, cats being weird,
                   crazy cat, cat fails, pets, funny pets, cute cats, viral cat,
                   cat compilation, cat moments, kitten, silly cat, cat behavior,
                   animals doing funny things, shorts, funny shorts, cat lovers]
    youtube_category_id: "15"             # 15 Pets & Animals
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    seo_language: "en"
    edit:
      enabled: true
      zoom_crop_pct: 2.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.06
      contrast: 1.05
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 11
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [56, 189, 248]
      hook_templates:
        - "CAT CHAOS"
        - "WAIT FOR IT"
        - "NOT AGAIN"
        - "PURE CHAOS"

    slot_publish_times_utc:               # these ARE the cron fire times
      1: "16:00"                          # 12:00 PM US Eastern (US midday scroll)
      2: "23:00"                          # 7:00 PM US Eastern (US evening prime)
