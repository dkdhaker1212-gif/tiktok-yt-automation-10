# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_10                        # unique; used in DB, logs, secret names
    tiktok_username: "bro.and.dickens"    # no @  -- chaotic / funny cat content (a guy + his cat "Dickens")
    youtube_channel_name: "Cat Chaos Lab"
    owner_email: "dkdhaker00011@gmail.com"

    google_credentials_file: "credentials/channel_10_client_secret.json"
    oauth_token_file: "tokens/channel_10_token.json"

    videos_per_day: 3
    description_footer: ""
    default_tags: [funny cats, cat shorts, cat chaos, funny animals, cats being weird,
                   crazy cat, cat fails, pets, funny pets, cute cats, viral cat,
                   cat compilation, cat moments, kitten, silly cat, cat behavior,
                   animals doing funny things, shorts, funny shorts, cat lovers]
    youtube_category_id: "15"             # 15 Pets & Animals
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: latest_popular           # newest uploads first, most-viewed among them first
    max_download_candidates: 20

    use_ai_seo: true
    seo_language: "en"
    edit:
      enabled: true
      # 9:16 vertical kept as-is (Shorts). Tuned for quality: gentle retime,
      # sharpen + light colour pop, near-lossless crf, no denoise softening.
      zoom_crop_pct: 1.5
      speed: 1.02
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.05
      contrast: 1.04
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 11
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [56, 189, 248]
      hook_templates:
        - "CAT CHAOS"
        - "WAIT FOR IT"
        - "NOT AGAIN"
        - "PURE CHAOS"

    slot_publish_times_utc:               # these ARE the cron fire times (IST = UTC + 5:30)
      1: "12:30"                          # 6:00 PM IST
      2: "14:30"                          # 8:00 PM IST
      3: "15:30"                          # 9:00 PM IST
